<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="perfil.css" rel="stylesheet" />
    <title>Pramanhã - Turmas</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dosis:wght@200..800&display=swap');
    </style>
    
</head>

<body>
    <header>

        <nav>
            <h1 id="logo">
                <a href="turmas.html"><img src="imagens/logo.svg" /></a> 
            </h1>

            <form action="" id="barra_pesquisa">
                <input type="search" name="pesquisa" placeholder="Busque sua turma" />
                <button type="submit"><img src="imagens/lupa.svg" /></button>
            </form>

            <ul id="nav_botoes">
                <li id="botao_perfil"><a href="login.html"><img src="imagens/conta.svg" /></a></li>
                <li id="botao_menu">
                    <button type="button"><img src="imagens/menu.svg" /></button>

                    <!--Modal - Menu-->

                    <div id="menu_modal">
                        <ul>
                            <li><a href="turmas.html">Turmas</a></li>
                            <li><a href=".html">Sair da conta</a></li>
                        </ul>
                    </div>
                </li>

            </ul>
        </nav>   

    </header>

    <main>
        <div>
            <section id="dados_gerais">
                <div id="perfil_cabecalho">
                    <h1>Dados perfil</h1>

                    <button type="button" onclick="document.getElementById('id01').style.display='block'" id="botao_perfil_editar"><img src="imagens/editar.svg" /> <span>Editar perfil</span></button>
                </div>
                <div id="ver_dados">
                    <div id="perfil_informacoes">
                        <div>
                            <span>Nome completo:</span>
                            <span>E-mail:</span>
                            <span>Campus:</span>
                            <span>Curso:</span>
                        </div>
                        <div id="perfil_dados">
                            <span id="nome_perfil">Rafael Gomes da Cunha</span>
                            <span id="email_perfil">rafael.cunha@escolar.ifrn.edu.br</span>
                            <span id="campus_perfil">Natal - Central</span>
                            <span id="curso_perfil">Infoweb 4</span>
                        </div>
                    </div>
                    <div id="perfil_foto">
                        <img src="imagens/rat-dance.gif" alt="foto do perfil" id="foto_perfil" >
                    </div>
                </div>
            </section>
        
        </div>    
    </main>

    <footer>

        <address>
            <div>
                <p>Pramanhã CIA, 00.123.987/0001-50 </p>
            </div>
            <div id="redes_sociais">
                <a href="https://www.x.com/"><img src="imagens/x.svg" /></a>
                <a href="https://instagram.com/"><img src="imagens/instagram.svg" /></a>
                <a href="https://gmail.com/"><img src="imagens/gmail.svg" /></a>
            </div>
        </address>

    </footer>

    <!--MODAL 1 / Editar perfil-->

    <div id="id01" class="modal">
        <span onclick="document.getElementById('id01').style.display='none'" class="close" title="Close Modal">×</span>
        <form class="modal-content" action="perfil.html">
          <div class="container">

            <h1 id="adicionar_tarefa_cabecalho"><img src="imagens/editar.svg" /> <span>Editar perfil</span></h1>
                
            <div id="editar_perfil_conteudos">
                <div id="container_tarefa_1">
                    <input class="barra_texto" type="text" value="Rafael Gomes da Cunha" required placeholder="Nome Completo" />
                    <input class="barra_texto" type="email" value="rafael.cunha@escolar.ifrn.edu.br" required placeholder="E-mail" />
                    <input class="barra_texto" type="text" value="Natal - Central" placeholder="Campus" />
                    <input class="barra_texto" type="text" value="Infoweb 4" placeholder="Curso" />
                </div>

                <div id="perfil_foto">
                    <button type="image"><img src="imagens/rat-dance.gif" alt="foto do perfil" id="foto_perfil" /></button>
                </div>
            </div>
          
            <div class="container_botoes">
                <div id="botoes">
                    <button type="submit" class="adicionar"><div><img src="imagens/certo_icone.svg" /><span>Criar</span></div></button>
                    <button type="button" onclick="document.getElementById('id01').style.display='none'" class="cancelar"><div><img src="imagens/x_icone.svg"><span>Cancelar</span></div></button>
                </div>

              </div>
            </div>
          </div>
        </form>
    </div>
    
    <script src="turma.js"></script>

</body>
</html>
