<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="turmas.css" rel="stylesheet" />
    <title>Pramanhã - Turmas</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dosis:wght@200..800&display=swap');
    </style>
    
</head>

<body>
    <header>

        <nav>
            <h1 id="logo">
                <a href="turmas.html"><img src="imagens/logo.svg" /></a> 
            </h1>

            <form action="" id="barra_pesquisa">
                <input type="search" name="pesquisa" placeholder="Busque sua turma" />
                <button type="submit"><img src="imagens/lupa.svg" /></button>
            </form>

            <ul id="nav_botoes">
                <li id="botao_perfil"><a href="perfil.html"><img src="imagens/conta.svg" /></a></li>
                <li id="botao_menu">
                    <button type="button"><img src="imagens/menu.svg" /></button>

                    <!--Modal - Menu-->

                    <div id="menu_modal">
                        <ul>
                            <li><a href="turmas.html">Turmas</a></li>
                            <li><a href="index.html">Sair da conta</a></li>
                        </ul>
                    </div>
                </li>

            </ul>
        </nav>   

    </header>

    <main>

        <section id="pagina_cabecalho">

            <a href="turmas.html">Turmas</a>

            <button onclick="document.getElementById('id01').style.display='block'"><img src="imagens/adicionar.svg" /> <span>Criar turma</span></button>

        </section>

        <!--Modal - Criar turma-->

        <div id="id01" class="modal">
            <span onclick="document.getElementById('id01').style.display='none'" class="close" title="Close Modal">×</span>
            <form class="modal-content" action="turmas.html">
              <div class="container">

                <h1 id="adicionar_tarefa_cabecalho"><img src="imagens/adicionar.svg" /> <span>Criar turma</span></h1>
                    
                <div id="container_tarefa_1">
                    <input class="barra_texto" type="text" placeholder="Nome da turma" required />
                </div>

                <div id="container_tarefa_2">
                    <div id="anexar_imagem">
                        <label for="myFile">Anexar imagem:</label>
                        <input type="file" id="myFile" name="filename" accept="image/*">
                    </div>
                    <div id="cor_da_tarefa">
                        <span id="cor_tarefa"></span>
                        <input id="hexadecimal" type="text" value="#FFAF66">
                    </div>
                </div>

              
                <div class="container_botoes">
                    <div id="botoes">
                        <button type="submit" class="adicionar"><div><img src="imagens/certo_icone.svg" /><span>Criar</span></div></button>
                        <button onclick="document.getElementById('id01').style.display='none'" class="cancelar"><div><img src="imagens/x_icone.svg"><span>Cancelar</span></div></button>
                    </div>

                  </div>
                </div>
              </div>
            </form>
        </div>

        <!--Modal - Criar turma-->

        <section id="turmas">
            <a href="turma.html" id="turma_1">
                <div class="turmas"> 
                    <img src="imagens/caderno.svg" class="turma_caderno" />
                    <img src="imagens/rato_girando.gif" class="turma_imagem" />
                    <div class="turma_nome"><h2>Infoweb 4V</h2></div>
                </div>
            </a>
            <a href="turma.html" id="turma_2">
                <div class="turmas"> 
                    <img src="imagens/caderno.svg" class="turma_caderno" />
                    <img src="imagens/banner_1.png" class="turma_imagem" />
                    <div class="turma_nome"><h2>Infoweb 4V</h2></div>
                </div>
            </a>    
            
        </section>

    </main>

    <footer>

        <address>
            <div>
                <p>Pramanhã CIA, 00.123.987/0001-50 </p>
            </div>
            <div id="redes_sociais">
                <a href="https://www.x.com/"><img src="imagens/x.svg" /></a>
                <a href="https://instagram.com/"><img src="imagens/instagram.svg" /></a>
                <a href="https://gmail.com/"><img src="imagens/gmail.svg" /></a>
            </div>
        </address>

    </footer>

    <script src="turmas.js"></script>

</body>
</html>
